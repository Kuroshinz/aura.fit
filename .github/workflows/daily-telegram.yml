name: Daily Telegram Routine Scheduler

on:
  schedule:
    # 00:00 UTC = 07:00 sáng giờ Việt Nam (UTC+7) — mỗi ngày
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép chạy tay để test

jobs:
  send-routines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-save pg

      - name: Send today's routines to Telegram
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          NEXT_PUBLIC_WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node scripts/send-daily-routines-cloud.js
